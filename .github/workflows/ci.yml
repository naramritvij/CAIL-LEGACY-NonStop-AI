name: CAIL integration quality gates

on:
  push:
    branches: [main, feat/secure-live-read-and-general-ai]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cail-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/tests
      - name: Run all backend tests (no live gateway calls)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify API and safety contracts
        working-directory: frontend
        run: npm run test:contract
      - name: Typecheck and production Vite build
        working-directory: frontend
        run: npm run build
