# Safe public demo gateway. Only publish this gateway through Tailscale Funnel.
# The upstream 'demo-backend' is an isolated ephemeral synthetic container.
# No expert/reviewer credentials, persisted knowledge volumes, uploads or approvals.
map "$request_method:$uri" $cail_api_allowed {
    default 0;
    # Read-only endpoints are safe against the isolated fictional data store.
    ~^GET:/api/v1/[A-Za-z0-9_/-]+$ 1;

    # Limited synthetic, read-only or bounded local-model POST endpoints.
    "POST:/api/v1/operations/atm/chat" 1;
    "POST:/api/v1/assistant/ask" 1;
    "POST:/api/v1/operations/atm/assist" 1;
    "POST:/api/v1/operations/lab/command" 1;
    "POST:/api/v1/operations/lab/ask" 1;
    "POST:/api/v1/operations/commands/preview" 1;
    "POST:/api/v1/operations/playbook/preview" 1;
    "POST:/api/v1/operations/playbook/recommend" 1;
    "POST:/api/v1/investigate/grounded" 1;
    "POST:/api/v1/investigate" 1;
    "POST:/api/v1/diagnostics/preview" 1;
    "POST:/api/v1/diagnostics/templates/preview" 1;
    "POST:/api/v1/knowledge/retrieve" 1;
    "POST:/api/v1/knowledge/search" 1;
}
# Funnel via host-to-container port forwarding can make distinct visitors
# appear as one peer. This limit is intentionally conservative and may
# be shared across judges. Tuning should not disable it entirely.
limit_req_zone $binary_remote_addr zone=cail_reads:10m rate=50r/m;
limit_req_zone $binary_remote_addr zone=cail_ai:10m rate=5r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /healthz {
        default_type text/plain;
        return 200 "CAIL public synthetic gateway ready\n";
    }

    # GET read-only plus strict POST allowlist, evaluated for EVERY request.
    # Includes Qwen interpretation via host Ollama but never raw Ollama access.
    location ^~ /api/v1/ {
        if ($cail_api_allowed = 0) { return 403; }

        limit_req zone=cail_reads burst=30 nodelay;
        proxy_pass http://demo-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 4s;
        proxy_read_timeout 110s;
        proxy_send_timeout 20s;
        proxy_buffering on;
        proxy_hide_header Server;
    }

    # Extra global throttling for public AI prompts using a named location is
    # deliberately implemented separately from the read-only app endpoint.
    location = /api/v1/operations/lab/ask {
        if ($request_method != POST) { return 403; }
        limit_req zone=cail_ai burst=2 nodelay;
        proxy_pass http://demo-backend:8000;
        proxy_connect_timeout 4s;
        proxy_read_timeout 110s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/investigate/grounded {
        if ($request_method != POST) { return 403; }
        limit_req zone=cail_ai burst=2 nodelay;
        proxy_pass http://demo-backend:8000;
        proxy_connect_timeout 4s;
        proxy_read_timeout 110s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # General AI route: bounded independent knowledge, no production tools.
    location = /api/v1/assistant/ask {
        if ($request_method != POST) { return 403; }
        limit_req zone=cail_ai burst=2 nodelay;
        proxy_pass http://demo-backend:8000;
        proxy_connect_timeout 4s;
        proxy_read_timeout 110s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/investigate {
        if ($request_method != POST) { return 403; }
        limit_req zone=cail_ai burst=2 nodelay;
        proxy_pass http://demo-backend:8000;
        proxy_connect_timeout 4s;
        proxy_read_timeout 110s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never proxy API documentation, raw admin endpoints or Ollama directly.
    # They are not part of the /api/v1 allowlist; SPA fallback covers paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
