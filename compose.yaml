services:
  backend:
    build: ./backend
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b-instruct
      LEGACY_DATABASE_PATH: /data/legacy.sqlite3
      LEGACY_EXPERT_KEY: ${LEGACY_EXPERT_KEY:-}
      LEGACY_REVIEWER_KEY: ${LEGACY_REVIEWER_KEY:-}
      # Optional server-side live read gateway; never enabled in compose.funnel.yaml.
      CAIL_LIVE_ENABLED: ${CAIL_LIVE_ENABLED:-false}
      CAIL_OPERATOR_READ_KEY: ${CAIL_OPERATOR_READ_KEY:-}
      CAIL_LIVE_ALLOWED_HOSTS: ${CAIL_LIVE_ALLOWED_HOSTS:-}
      CAIL_LIVE_ASAP_URL: ${CAIL_LIVE_ASAP_URL:-}
      CAIL_LIVE_ASAP_TOKEN: ${CAIL_LIVE_ASAP_TOKEN:-}
      CAIL_LIVE_EMS_URL: ${CAIL_LIVE_EMS_URL:-}
      CAIL_LIVE_EMS_TOKEN: ${CAIL_LIVE_EMS_TOKEN:-}
      CAIL_LIVE_SCF_URL: ${CAIL_LIVE_SCF_URL:-}
      CAIL_LIVE_SCF_TOKEN: ${CAIL_LIVE_SCF_TOKEN:-}
      CAIL_LIVE_GUARDIAN_URL: ${CAIL_LIVE_GUARDIAN_URL:-}
      CAIL_LIVE_GUARDIAN_TOKEN: ${CAIL_LIVE_GUARDIAN_TOKEN:-}
      CAIL_LIVE_PATHWAY_URL: ${CAIL_LIVE_PATHWAY_URL:-}
      CAIL_LIVE_PATHWAY_TOKEN: ${CAIL_LIVE_PATHWAY_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - legacy_knowledge:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build: ./frontend
    environment:
      VITE_LEGACY_DATA_MODE: http
      VITE_API_BASE: /api/v1
      LEGACY_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"
volumes:
  legacy_knowledge:
