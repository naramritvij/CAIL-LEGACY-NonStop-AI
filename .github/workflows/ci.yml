name: CAIL integration quality gates

on:
  push:
    branches: [main, feat/secure-live-read-and-general-ai]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cail-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/tests
      - name: Run all backend tests (no live gateway calls)
        working-directory: backend
        run: python -m pytest -q
      - name: Verify HTTP graph upload, private access and restart retention
        run: python scripts/verify_graph_http.py
      - name: Verify the complete knowledge transfer journey
        run: python scripts/verify_knowledge_transfer.py
      - name: Verify source transport and scope using synthetic TLS and MOMI fixtures
        run: python scripts/verify_source_transport.py
      - name: Score 120 offline answers and verify incident rehearsals
        run: python scripts/evaluate_workspace.py --report "${{ runner.temp }}/cail-offline-evaluation.json"
      - name: Retain the answer evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cail-offline-answer-evaluation
          path: ${{ runner.temp }}/cail-offline-evaluation.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify API and safety contracts
        working-directory: frontend
        run: npm run test:contract
      - name: Verify dense graph readability
        working-directory: frontend
        run: npm run test:graph
      - name: Typecheck and production Vite build
        working-directory: frontend
        run: npm run build
