services:
  backend:
    build: ./backend
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b-instruct
      LEGACY_DATABASE_PATH: /data/legacy.sqlite3
      LEGACY_EXPERT_KEY: ${LEGACY_EXPERT_KEY:-}
      LEGACY_REVIEWER_KEY: ${LEGACY_REVIEWER_KEY:-}
      CAIL_WORKSPACE_LOCAL_DEMO: ${CAIL_WORKSPACE_LOCAL_DEMO:-true}
      CAIL_WORKSPACE_LOCAL_NAME: ${CAIL_WORKSPACE_LOCAL_NAME:-Local operator}
      CAIL_WORKSPACE_USERS: ${CAIL_WORKSPACE_USERS:-[]}
      CAIL_KNOWLEDGE_RELEASE: ${CAIL_KNOWLEDGE_RELEASE:-L23.08}
      # Optional server-side live read gateway; never enabled in compose.funnel.yaml.
      CAIL_LIVE_ENABLED: ${CAIL_LIVE_ENABLED:-false}
      CAIL_OPERATOR_READ_KEY: ${CAIL_OPERATOR_READ_KEY:-}
      CAIL_LIVE_ALLOWED_HOSTS: ${CAIL_LIVE_ALLOWED_HOSTS:-}
      CAIL_LIVE_PROGNOSIS_URL: ${CAIL_LIVE_PROGNOSIS_URL:-}
      CAIL_LIVE_PROGNOSIS_TOPOLOGY_URL: ${CAIL_LIVE_PROGNOSIS_TOPOLOGY_URL:-}
      CAIL_LIVE_PROGNOSIS_TOKEN: ${CAIL_LIVE_PROGNOSIS_TOKEN:-}
      CAIL_PROGNOSIS_DATASET_URL: ${CAIL_PROGNOSIS_DATASET_URL:-}
      CAIL_PROGNOSIS_USER: ${CAIL_PROGNOSIS_USER:-}
      CAIL_PROGNOSIS_PASSWORD: ${CAIL_PROGNOSIS_PASSWORD:-}
      CAIL_PROGNOSIS_SYSTEM_ID: ${CAIL_PROGNOSIS_SYSTEM_ID:-}
      CAIL_PROGNOSIS_FIELDS: ${CAIL_PROGNOSIS_FIELDS:-}
      CAIL_PROGNOSIS_ROWS_KEY: ${CAIL_PROGNOSIS_ROWS_KEY:-}
      CAIL_MOMI_EXPORT_DIR: ${CAIL_MOMI_EXPORT_DIR:-}
      CAIL_MOMI_SYSTEM_ID: ${CAIL_MOMI_SYSTEM_ID:-}
      CAIL_LIVE_MOMI_URL: ${CAIL_LIVE_MOMI_URL:-}
      CAIL_LIVE_MOMI_TOPOLOGY_URL: ${CAIL_LIVE_MOMI_TOPOLOGY_URL:-}
      CAIL_LIVE_MOMI_TOKEN: ${CAIL_LIVE_MOMI_TOKEN:-}
      CAIL_LIVE_ASAP_URL: ${CAIL_LIVE_ASAP_URL:-}
      CAIL_LIVE_ASAP_TOPOLOGY_URL: ${CAIL_LIVE_ASAP_TOPOLOGY_URL:-}
      CAIL_LIVE_ASAP_TOKEN: ${CAIL_LIVE_ASAP_TOKEN:-}
      CAIL_ASAP_SYSTEM_ID: ${CAIL_ASAP_SYSTEM_ID:-}
      CAIL_LIVE_EMS_URL: ${CAIL_LIVE_EMS_URL:-}
      CAIL_LIVE_EMS_TOKEN: ${CAIL_LIVE_EMS_TOKEN:-}
      CAIL_LIVE_SCF_URL: ${CAIL_LIVE_SCF_URL:-}
      CAIL_LIVE_SCF_TOKEN: ${CAIL_LIVE_SCF_TOKEN:-}
      CAIL_LIVE_GUARDIAN_URL: ${CAIL_LIVE_GUARDIAN_URL:-}
      CAIL_LIVE_GUARDIAN_TOKEN: ${CAIL_LIVE_GUARDIAN_TOKEN:-}
      CAIL_LIVE_PATHWAY_URL: ${CAIL_LIVE_PATHWAY_URL:-}
      CAIL_LIVE_PATHWAY_TOKEN: ${CAIL_LIVE_PATHWAY_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - legacy_knowledge:/data
      - ${CAIL_MOMI_EXPORT_HOST_DIR:-./data/momi-inbox}:/readonly-momi:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  practice:
    build: ./backend
    command: ["python", "-m", "app.graph_practice", "--host", "0.0.0.0", "--port", "8000", "--data-dir", "/practice-data"]
    volumes:
      - practice_knowledge:/practice-data
  frontend:
    build: ./frontend
    environment:
      VITE_LEGACY_DATA_MODE: http
      VITE_API_BASE: /api/v1
      LEGACY_API_PROXY_TARGET: http://backend:8000
      CAIL_PRACTICE_PROXY_TARGET: http://practice:8000
    depends_on:
      - backend
      - practice
    ports:
      - "127.0.0.1:5173:5173"
volumes:
  legacy_knowledge:
  practice_knowledge:
